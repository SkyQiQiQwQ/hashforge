name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Smoke test the native CLI
        if: matrix.platform != 'macos-x64'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cli="target/$TARGET/release/hashforge-cli"
          if [[ "$PLATFORM" == windows-* ]]; then cli="$cli.exe"; fi
          actual=$("$cli" text abc)
          test "$actual" = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  sha256"
      - name: Package binaries and documentation
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p package dist
          cp README.md LICENSE package/
          cp assets/fonts/LICENSE.txt package/FONT-LICENSE.txt
          if [[ "$PLATFORM" == windows-* ]]; then
            cp "target/$TARGET/release/hashforge.exe" "target/$TARGET/release/hashforge-cli.exe" package/
            cp package/*.exe dist/
            7z a "dist/hashforge-$PLATFORM.zip" ./package/*
          else
            cp "target/$TARGET/release/hashforge" "target/$TARGET/release/hashforge-cli" package/
            chmod +x package/hashforge package/hashforge-cli
            tar -czf "dist/hashforge-$PLATFORM.tar.gz" -C package .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: hashforge-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hashforge-*
          merge-multiple: true
          path: dist
      - name: Include bundled font license
        run: cp assets/fonts/LICENSE.txt dist/FONT-LICENSE.txt
      - name: Generate checksums
        working-directory: dist
        run: sha256sum hashforge* > SHA256SUMS.txt
      - name: Publish all platforms together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Git refs cannot contain spaces. The release title retains the requested format.
          # If a rerun falls in the same minute, wait for a fresh tag instead of overwriting it.
          for attempt in {1..7}; do
            stamp=$(TZ=Asia/Shanghai date +'%Y%m%d-%H%M')
            tag="build-$stamp"
            if ! gh api "repos/$GH_REPO/git/ref/tags/$tag" --silent 2>/dev/null \
              && ! gh release view "$tag" >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == 7 ]]; then
              echo "::error::Could not allocate a new minute-based build tag."
              exit 1
            fi
            sleep 10
          done
          title="build-${stamp/-/ }"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          自动构建版本，构建时间使用北京时间（Asia/Shanghai）。

          源码提交：[$GITHUB_SHA](https://github.com/$GH_REPO/commit/$GITHUB_SHA)

          | 平台 | 下载文件 |
          | --- | --- |
          | Windows x64 | hashforge-windows-x64.zip，或直接下载 hashforge.exe / hashforge-cli.exe |
          | Linux x64 | hashforge-linux-x64.tar.gz |
          | macOS Apple Silicon | hashforge-macos-arm64.tar.gz |
          | macOS Intel | hashforge-macos-x64.tar.gz |

          每个压缩包包含图形界面、命令行工具、README、MIT 许可证和内置思源黑体的 SIL Open Font License。单独下载 Windows EXE 时，请同时保留 FONT-LICENSE.txt。Linux / macOS 解压后运行 hashforge 或 hashforge-cli。Linux 版本在 Ubuntu 22.04 上构建，需要桌面图形环境才能运行 GUI。

          SHA256SUMS.txt 提供所有下载文件的 SHA-256 校验值。本次发布已通过三平台格式检查、测试与严格 Clippy，并完成四个目标的 Release 构建。
          EOF
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft
          gh release edit "$tag" --draft=false --latest
