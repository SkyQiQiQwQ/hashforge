[package]
name = "hashforge"
version = "0.1.0"
edition = "2021"
description = "A fast desktop hash calculator and file verification tool"
license = "MIT"
readme = "README.md"
repository = "https://github.com/SkyQiQiQwQ/hashforge"
keywords = ["hash", "checksum", "sha256", "desktop", "cli"]
categories = ["command-line-utilities", "cryptography", "gui"]

[[bin]]
name = "hashforge"
path = "src/main.rs"

[[bin]]
name = "hashforge-cli"
path = "src/bin/hashforge-cli.rs"

[dependencies]
blake2 = "0.10"
blake3 = { version = "1", default-features = false, features = ["std"] }
crc32fast = "1"
digest = "0.10"
eframe = { version = "0.37", default-features = false, features = ["clipboard", "default_fonts", "glow", "wayland", "x11"] }
md-5 = "0.10"
rfd = "0.17"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
